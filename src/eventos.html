<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <script>
    // Enlaces antiguos a un evento concreto → su ficha. ?evento=ID viene de
    // enlaces compartidos por WhatsApp; ?id=ID, de las notificaciones push.
    (function(){var q=new URLSearchParams(location.search),id=q.get('evento')||q.get('id');if(id)location.replace('evento.html?id='+encodeURIComponent(id));})();
  </script>
  <style>html,body{background:#FAF5EE}</style>
  <style>
    #pt-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#FAF5EE;transition:opacity .2s ease}
    #pt-overlay .pt-spinner{width:40px;height:40px;border-radius:50%;border:3px solid rgba(27,46,94,.15);border-top-color:#1B2E5E;animation:pt-spin .8s linear infinite}
    @keyframes pt-spin{to{transform:rotate(360deg)}}
    body.page-ready #pt-overlay{opacity:0;pointer-events:none}
    body:not(.page-ready) .main-content{visibility:hidden}
  </style>
  <link rel="icon" type="image/png" sizes="48x48" href="img/icon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <title>{{name}} — Eventos</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/eventos.css">
  <style>
    .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
    @media (max-width: 768px) { .main-content { margin-left: 0; } }
    .eventos-inner { max-width: 960px; margin: 0 auto; padding: 32px 32px 60px; }
    @media (max-width: 768px) { .eventos-inner { padding: 20px 14px 88px; } }

    /* ─── Vista toggle ─── */
    .view-toggle {
      display: flex;
      background: var(--color-bg);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 2px;
    }
    .view-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 6px;
      font-size: .8125rem; font-weight: 500;
      color: var(--color-text-muted); cursor: pointer;
      border: none; background: none; transition: all var(--transition-fast);
    }
    .view-btn svg { width: 15px; height: 15px; }
    .view-btn.active {
      background: var(--color-white); color: var(--color-primary);
      box-shadow: var(--shadow-sm); font-weight: 600;
    }

    /* ─── Filtro chips ─── */
    .filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip {
      padding: 6px 16px; border-radius: var(--radius-full);
      font-size: .8125rem; font-weight: 500;
      border: 1.5px solid var(--color-border);
      color: var(--color-text-muted); cursor: pointer;
      background: var(--color-white); white-space: nowrap;
      transition: all var(--transition-fast);
    }
    .chip:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .chip.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }


    /* ─── Calendario ─── */
    .cal-wrap { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
    @media (max-width: 768px) { .cal-wrap { grid-template-columns: 1fr; } }

    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .cal-month-label { font-family: var(--font-brand); font-size: 1.2rem; font-weight: 700; color: var(--color-text); }
    .cal-nav-btn {
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      background: var(--color-white); border: 1.5px solid var(--color-border);
      cursor: pointer; transition: all var(--transition-fast);
      color: var(--color-text);
    }
    .cal-nav-btn:hover { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .cal-nav-btn svg { width: 16px; height: 16px; }

    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
    .cal-header-day { text-align: center; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted); padding: 8px 0; }
    .cal-day {
      aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: var(--radius-sm); cursor: pointer; position: relative;
      transition: background var(--transition-fast); font-size: .875rem; font-weight: 400;
      color: var(--color-text); padding: 4px;
    }
    .cal-day:hover { background: var(--color-bg); }
    .cal-day.other { color: var(--color-text-light); }
    .cal-day.today { background: var(--color-primary); color: #fff; font-weight: 700; }
    .cal-day.today:hover { background: var(--color-primary-dark); }
    .cal-day.selected { background: var(--color-gold-light); border: 2px solid var(--color-gold); font-weight: 600; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; position: absolute; bottom: 4px; }
    .cal-day.today .cal-dot { background: var(--color-gold); }
    .cal-dot-color { background: var(--color-gold); }

    .cal-side { background: var(--color-white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: 20px; }
    .cal-side-title { font-size: .9375rem; font-weight: 700; color: var(--color-text); margin-bottom: 14px; }
    .cal-event-item { padding: 10px 0; border-bottom: 1px solid var(--color-border-light); }
    .cal-event-item:last-child { border-bottom: none; }
    .cal-event-time { font-size: .75rem; font-weight: 600; color: var(--color-gold-dark); margin-bottom: 2px; }
    .cal-event-name { font-size: .875rem; font-weight: 500; color: var(--color-text); }
    .cal-event-place { font-size: .775rem; color: var(--color-text-muted); }
    .cal-empty { text-align: center; color: var(--color-text-light); font-size: .875rem; padding: 24px 0; }

    /* ─── Botón basurita admin ─── */
    .btn-trash { position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%; background:#fff; border:1.5px solid #fca5a5; color:#ef4444; cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s,background .15s; z-index:10; box-shadow:0 1px 6px rgba(0,0,0,.12); padding:0; }
    .btn-trash:hover { background:#fef2f2; }

    /* ─── Admin FAB ─── */
    .fab-admin { position:fixed; bottom:28px; right:28px; width:54px; height:54px; border-radius:50%; background:#C9A84C; color:#fff; border:none; font-size:1.6rem; cursor:pointer; box-shadow:0 4px 18px rgba(201,168,76,0.45); display:flex; align-items:center; justify-content:center; z-index:100; transition:background 0.15s,transform 0.15s; }
    .fab-admin:hover { background:#a8892e; transform:scale(1.06); }
    @media (max-width:768px) { .fab-admin { bottom:80px; right:18px; } }

    /* ─── Admin Modal ─── */
    .admin-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:300; display:flex; align-items:center; justify-content:center; padding:16px; }
    .admin-modal-overlay.hidden { display:none; }
    .admin-modal { background:#fff; border-radius:16px; width:100%; max-width:540px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
    .admin-modal-header { display:flex; align-items:center; justify-content:space-between; padding:20px 24px 16px; border-bottom:1px solid var(--color-border); }
    .admin-modal-header h3 { font-size:1.1rem; font-weight:700; }
    .admin-modal-close { background:none; border:none; cursor:pointer; padding:4px; color:var(--color-text-muted); border-radius:8px; }
    .admin-modal-close:hover { background:var(--color-bg); }
    .admin-modal-body { padding:20px 24px; display:flex; flex-direction:column; gap:14px; }
    .admin-modal-footer { padding:16px 24px; border-top:1px solid var(--color-border); display:flex; gap:10px; justify-content:flex-end; }
    .form-group { display:flex; flex-direction:column; gap:5px; }
    .form-group label { font-size:0.78rem; font-weight:600; color:var(--color-text-muted); text-transform:uppercase; letter-spacing:0.05em; }
    .form-group input, .form-group textarea, .form-group select { border:1.5px solid var(--color-border); border-radius:8px; padding:9px 12px; font-size:0.9rem; font-family:inherit; outline:none; transition:border-color 0.15s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color:var(--color-primary); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    /* Duplicado en línea a propósito (ver también css/components.css): los
       demás arreglos de hoy (deep-link, scroll del mikve, home) son HTML/JS
       propio de cada página y llegaban al momento a los móviles reales,
       pero este viene de css/components.css — un archivo enlazado y
       cacheado aparte — y tardaba en reflejarse en dispositivos reales
       (aunque sí en el simulador de Xcode) mucho más que el resto. Poniendo
       la regla también aquí, dentro del propio eventos.html, deja de
       depender de la caché de ese archivo CSS suelto. */
    @media (max-width: 480px) {
      .modal-overlay.modal-centered { align-items: center; padding: var(--spacing-lg); }
      .modal-centered .modal { border-radius: var(--radius-md); max-height: 90vh; max-height: 90dvh; max-width: 380px; animation: modalIn var(--transition-normal) ease; }
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b2e5e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{name}}">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);}</script>
  <script defer src='/_vercel/insights/script.js'></script>
  <script>window.si=window.si||function(){(window.siq=window.siq||[]).push(arguments);}</script>
  <script defer src='/_vercel/speed-insights/script.js'></script>
  <!-- Transición sin hueco crema: si el navegador soporta View Transitions
       entre páginas (Safari/WKWebView iOS 18.2+, Chrome 123+), no se pinta
       nada de la página nueva hasta que #pt-ready (final del body) se ha
       leído; mientras, se sigue viendo la anterior y luego hay crossfade.
       Sin soporte: todo igual que antes (overlay + spinner). -->
  <script>if('PageRevealEvent' in window){document.documentElement.classList.add('vt');document.write('<link rel="expect" href="#pt-ready" blocking="render">');}</script>
  <style>html.vt:not(.vt-wait) #pt-overlay{display:none!important}html.vt body:not(.page-ready) .main-content{visibility:visible!important}</style>
  <style>
    .page-header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .share-all-btn { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .share-all-btn svg { width: 15px; height: 15px; }
  </style>
  <script>
    // Smart App Banner de Safari (iOS): «Abrir» en la app en esta misma página
    (function(){ try { if (!{{app.openInAppBanner}} || window.Capacitor) return; var m=document.createElement('meta'); m.name='apple-itunes-app';
      m.content='app-id={{stores.appStoreId}}, app-argument='+location.href; document.head.appendChild(m); } catch(e){} })();
  </script>
  <script src="js/lang-en.js"></script>
</head>
<body>
<div id="pt-overlay"><div class="pt-spinner"></div></div>
<script>document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("page-ready");});</script>
<div id="sidebar-placeholder"></div>
<div class="main-content">
  <div class="eventos-inner">

    <!-- Header -->
    <div class="page-header">
      <div class="page-header-left">
        <p class="page-header-label">Calendario</p>
        <h1 class="page-title">Eventos</h1>
        <p class="page-subtitle">Actividades y celebraciones de la comunidad</p>
      </div>
      <div class="page-header-actions">
        <div class="view-toggle">
          <button class="view-btn active" id="btn-lista" onclick="setView('lista')">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
            Lista
          </button>
          <button class="view-btn" id="btn-cal" onclick="setView('calendario')">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5"/></svg>
            Calendario
          </button>
          <a href="calendario.html" class="view-btn" style="text-decoration:none;">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
            Hebreo
          </a>
        </div>
        <button class="btn btn-primary btn-sm share-all-btn" onclick="compartirTodos()" title="Compartir el enlace a todos los eventos">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z"/></svg>
          Compartir eventos
        </button>
      </div>
    </div>

    <!-- ─── VISTA LISTA ─── -->
    <div id="view-lista">
      <div class="filter-chips mb-lg" id="chips-container">
        <button class="chip active" data-filter="todos" onclick="setChip(this,'todos')">Todos</button>
        <button class="chip" data-filter="semana" onclick="setChip(this,'semana')">Esta semana</button>
        <button class="chip" data-filter="mes" onclick="setChip(this,'mes')">Este mes</button>
        <button class="chip" data-filter="para-mi" onclick="setChip(this,'para-mi')">Para mí</button>
      </div>
      <div id="eventos-list"><div class="ev-grid"><div class="kh-skel-card"></div><div class="kh-skel-card"></div><div class="kh-skel-card"></div></div></div>
    </div>

    <!-- ─── VISTA CALENDARIO ─── -->
    <div id="view-calendario" style="display:none;">
      <div class="cal-wrap">
        <div>
          <div class="cal-nav">
            <button class="cal-nav-btn" onclick="calPrev()">
              <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
            </button>
            <span class="cal-month-label" id="cal-label"></span>
            <button class="cal-nav-btn" onclick="calNext()">
              <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
            </button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
        <div class="cal-side">
          <p class="cal-side-title" id="cal-side-title">Selecciona un día</p>
          <div id="cal-side-events"><p class="cal-empty">Haz click en un día para ver sus eventos</p></div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast-container"></div>
<script src="/vendor/supabase.js"></script>
<script defer src="https://js.stripe.com/v3/"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/familia.js"></script>
<script src="js/nav.js"></script>
<script src="js/media.js"></script>
<script src="js/router.js"></script>
<script src="js/eventos-comun.js"></script>
<script>
  requireAuth();
  initNav('eventos');

  let activeFilter = 'todos';
  const DIAS_S = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

  /* ─── Vista toggle ─── */
  function setView(v) {
    document.getElementById('view-lista').style.display = v === 'lista' ? '' : 'none';
    document.getElementById('view-calendario').style.display = v === 'calendario' ? '' : 'none';
    document.getElementById('btn-lista').classList.toggle('active', v === 'lista');
    document.getElementById('btn-cal').classList.toggle('active', v === 'calendario');
    if (v === 'calendario') renderCal();
  }

  /* ─── Filtro chips ─── */
  function setChip(el, filter) {
    document.querySelectorAll('#chips-container .chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    activeFilter = filter;
    renderLista();
  }

  // Próximos primero (el más cercano a hoy el primero de todos), y ya
  // pasados al final (el más reciente de esos primero).
  function sortByProximity(evs) {
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    return evs.slice().sort((a, b) => {
      const da = evDate(a), db = evDate(b);
      const aFuturo = da >= hoy, bFuturo = db >= hoy;
      if (aFuturo !== bFuturo) return aFuturo ? -1 : 1;
      return aFuturo ? da - db : db - da;
    });
  }

  function filterEventos(evs) {
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    evs = evs.filter(e => !eventoPasado(e));
    if (activeFilter === 'semana') {
      const fin = new Date(hoy); fin.setDate(hoy.getDate() + 7);
      evs = evs.filter(e => { const d = evDate(e); return d >= hoy && d <= fin; });
    } else if (activeFilter === 'mes') {
      evs = evs.filter(e => { const d = evDate(e); return d.getMonth() === hoy.getMonth() && d.getFullYear() === hoy.getFullYear(); });
    } else if (activeFilter === 'para-mi') {
      evs = evs.filter(evEstaInscrito);
    }
    return sortByProximity(evs);
  }

  /* ─── Admin ─── */
  const _adminUser = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
  const _isAdmin = _adminUser?.role === 'admin';

  const TRASH_ICON = `<svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" style="width:15px;height:15px;"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>`;

  async function deleteEvento(id, e) {
    e.preventDefault(); e.stopPropagation();
    const idx = MOCK_EVENTOS.findIndex(ev => String(ev.id) === String(id));
    if (idx !== -1) MOCK_EVENTOS.splice(idx, 1);
    const sb = typeof getSupabase === 'function' ? getSupabase() : null;
    if (sb) { try { await sb.from('eventos').delete().eq('id', id); } catch(_) {} }
    renderLista();
    showToast('Evento eliminado', 'success');
  }

  /** Enlace general a todos los eventos, con la lista de los próximos. */
  function compartirTodos() {
    const url = '{{url}}/eventos.html';
    const proximos = sortByProximity(MOCK_EVENTOS.filter(e => !eventoPasado(e))).slice(0, 6);
    const lineas = proximos.map(e => {
      const f = evDate(e);
      return `• ${f.getDate()} ${MESES_S[f.getMonth()]}${e.hora ? ' ' + evHora(e) : ''} — ${e.titulo}`;
    });
    const texto = ['*Próximos eventos — {{name}}*', ...lineas, '', `Todos los eventos e inscripciones: ${url}`].join('\n');
    _shareData = { titulo: 'Eventos — {{name}}', linea: '', url, texto };
    abrirCompartir('Compartir todos los eventos', 'Enlace a la página de eventos de la comunidad');
  }

  /* ─── Lista ─── */
  function evCardHTML(ev) {
    const id = escHtml(String(ev.id));
    const fecha = evDate(ev);
    const libres = evPlazasLibres(ev);
    const acc = evAccion(ev).tipo;
    let btn = '';
    if (acc === 'inscrito') btn = `<span class="ev-tag is-ok">✓ Inscrito</span>`;
    else if (acc === 'espera') btn = `<button class="btn btn-sm btn-espera" onclick="openEspera('${id}',event)">Lista de espera</button>`;
    else btn = `<button class="btn btn-sm btn-primary" onclick="openInscripcion('${id}',event)">Inscribirse</button>`;

    return `
      <article class="ev-card" id="evcard-${id}" style="--ev-cat:${evCatColor(ev.categoria)}">
        ${_isAdmin ? `<button class="btn-trash" onclick="deleteEvento('${id}',event)" title="Eliminar evento" aria-label="Eliminar evento">${TRASH_ICON}</button>` : ''}
        ${evPosterHTML(ev, evPosterBadge(ev))}
        <div class="ev-card-body">
          <div class="ev-card-top">
            <div class="ev-date"><b>${fecha.getDate()}</b><span>${MESES_S[fecha.getMonth()]}</span></div>
            <div class="ev-tags">
              ${ev.categoria ? `<span class="ev-tag"><i></i>${escHtml(ev.categoria)}</span>` : ''}
              <span class="ev-tag">${escHtml(evDirigidoA(ev))}</span>
              ${libres !== null && libres > 0 && libres <= 5 ? `<span class="ev-tag is-warn">${libres === 1 ? 'Última plaza' : `Últimas ${libres} plazas`}</span>` : ''}
            </div>
          </div>
          <h3 class="ev-card-title"><a class="ev-card-link" href="${evUrl(ev.id)}">${escHtml(ev.titulo)}</a></h3>
          ${ev.descripcion ? `<p class="ev-card-desc">${escHtml(ev.descripcion)}</p>` : ''}
          <div class="ev-meta">
            ${ev.hora ? `<span>${EV_ICON.clock}${escHtml(evHora(ev))}</span>` : ''}
            <span>${EV_ICON.pin}${escHtml(evLugarCorto(ev))}</span>
            <span>${EV_ICON.users}${ev.aforo ? `${ev.inscritos || 0}/${ev.aforo}` : `${ev.inscritos || 0} inscritos`}</span>
          </div>
          <div class="ev-card-foot">
            <span class="ev-price">${escHtml(evPrecioTxt(ev))}</span>
            <div class="ev-card-actions">
              <button class="ev-icon-btn" title="Compartir evento" aria-label="Compartir evento" onclick="compartirEvento('${id}',event)">${EV_ICON.share}</button>
              ${btn}
            </div>
          </div>
        </div>
      </article>`;
  }

  function renderLista() {
    const container = document.getElementById('eventos-list');
    const evs = filterEventos(MOCK_EVENTOS);

    if (!evs.length) {
      if (!evCargado && !MOCK_EVENTOS.length) return;   // sigue el esqueleto hasta que responda Supabase
      const msg = activeFilter === 'para-mi' ? 'Todavía no estás inscrito en ningún evento próximo.' : 'No hay eventos con este filtro.';
      container.innerHTML = `<div class="empty-state"><svg class="empty-state-icon" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5"/></svg><p class="empty-state-title">Sin eventos</p><p class="empty-state-desc">${msg}</p></div>`;
      return;
    }

    const grupos = new Map();
    evs.forEach(ev => {
      const d = evDate(ev);
      const k = `${MESES_FULL[d.getMonth()]} ${d.getFullYear()}`;
      if (!grupos.has(k)) grupos.set(k, []);
      grupos.get(k).push(ev);
    });
    container.innerHTML = [...grupos].map(([mes, lista]) => `
      <section class="ev-month-group">
        <h2 class="ev-month-title">${mes}</h2>
        <div class="ev-grid">${lista.map(evCardHTML).join('')}</div>
      </section>`).join('');
  }

  /** Lo llama eventos-comun.js cada vez que cambian los datos. */
  function onEventosChange() {
    renderLista();
    if (document.getElementById('view-calendario').style.display !== 'none') renderCal();
  }

  /* ─── Calendario ─── */
  let calYear  = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let selectedDay = null;

  function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCal(); }
  function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCal(); }

  function eventsOnDay(d) {
    return MOCK_EVENTOS.filter(ev => {
      if (eventoPasado(ev)) return false;
      const fd = evDate(ev);
      return fd.getFullYear() === calYear && fd.getMonth() === calMonth && fd.getDate() === d;
    });
  }

  function renderCal() {
    document.getElementById('cal-label').textContent = `${MESES_FULL[calMonth]} ${calYear}`;
    const grid = document.getElementById('cal-grid');
    const today = new Date();
    let html = DIAS_S.map(d => `<div class="cal-header-day">${d}</div>`).join('');

    const firstDay = new Date(calYear, calMonth, 1);
    let startDow = firstDay.getDay();
    startDow = startDow === 0 ? 6 : startDow - 1; // lunes = 0
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const prevDays = new Date(calYear, calMonth, 0).getDate();

    for (let i = startDow - 1; i >= 0; i--) html += `<div class="cal-day other">${prevDays - i}</div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = today.getFullYear() === calYear && today.getMonth() === calMonth && today.getDate() === d;
      const hasEv = eventsOnDay(d).length > 0;
      html += `
        <div class="cal-day ${isToday ? 'today' : ''} ${selectedDay === d ? 'selected' : ''}" onclick="selectDay(${d})">
          ${d}
          ${hasEv ? `<span class="cal-dot ${isToday ? '' : 'cal-dot-color'}"></span>` : ''}
        </div>`;
    }
    const total = startDow + daysInMonth;
    const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
    for (let i = 1; i <= remaining; i++) html += `<div class="cal-day other">${i}</div>`;
    grid.innerHTML = html;

    if (selectedDay) renderCalSide(selectedDay);
  }

  function selectDay(d) {
    selectedDay = d;
    renderCal();
  }

  function renderCalSide(d) {
    document.getElementById('cal-side-title').textContent = `${d} de ${MESES_FULL[calMonth]}`;
    const evs = eventsOnDay(d);
    const side = document.getElementById('cal-side-events');
    if (!evs.length) {
      side.innerHTML = `<p class="cal-empty">Sin eventos este día</p>`;
      return;
    }
    side.innerHTML = evs.map(ev => `
      <a class="cal-event-item" href="${evUrl(ev.id)}">
        <p class="cal-event-time">${escHtml(evHora(ev))}${ev.categoria ? ' · ' + escHtml(ev.categoria) : ''}</p>
        <p class="cal-event-name">${escHtml(ev.titulo)}</p>
        <p class="cal-event-place">${escHtml(evLugarCorto(ev))}</p>
      </a>`).join('');
  }

  /* ─── Init ─── */
  evPintarInstantanea();
  evCargar();

  /* ─── Admin FAB ─── */
  (function() {
    const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
    if (!user || user.role !== 'admin') return;

    // FAB button
    const fab = document.createElement('button');
    fab.className = 'fab-admin';
    fab.setAttribute('aria-label', 'Añadir evento');
    fab.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width:24px;height:24px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>';
    document.body.appendChild(fab);

    // Modal HTML
    document.body.insertAdjacentHTML('beforeend', `
      <div class="admin-modal-overlay hidden" id="modal-add-evento">
        <div class="admin-modal">
          <div class="admin-modal-header">
            <h3>➕ Añadir evento</h3>
            <button class="admin-modal-close" onclick="document.getElementById('modal-add-evento').classList.add('hidden')">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:20px;height:20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="admin-modal-body">
            <div class="form-row">
              <div class="form-group">
                <label>Emoji</label>
                <input id="ev-emoji" placeholder="🎉" maxlength="4" value="📅">
              </div>
              <div class="form-group">
                <label>Categoría</label>
                <select id="ev-categoria">
                  <option>Shabat</option><option>Festividad</option><option>Estudio</option>
                  <option>Comunidad</option><option>Infantil</option><option>Cultura</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Título</label>
              <input id="ev-titulo" placeholder="Nombre del evento">
            </div>
            <div class="form-group">
              <label>Descripción</label>
              <textarea id="ev-desc" rows="3" placeholder="Describe el evento..."></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Fecha</label>
                <input id="ev-fecha" type="date">
              </div>
              <div class="form-group">
                <label>Hora</label>
                <input id="ev-hora" type="time" value="19:00">
              </div>
            </div>
            <div class="form-group">
              <label>Lugar</label>
              <input id="ev-lugar" placeholder="{{centerName}}" value="{{centerName}} — {{contact.street}}">
            </div>
            <div class="form-group">
              <label>Aforo máximo</label>
              <input id="ev-aforo" type="number" placeholder="Dejar vacío = sin límite">
            </div>
            <div class="form-group">
              <label>Foto del evento</label>
              <div style="border:2px dashed var(--color-border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;" onclick="document.getElementById('ev-img-file').click()">
                <img id="ev-img-preview" style="display:none;max-height:130px;border-radius:8px;margin-bottom:8px;max-width:100%;">
                <div id="ev-img-ph" style="color:var(--color-text-muted);font-size:0.85rem;">📷 Toca para subir foto</div>
              </div>
              <input type="file" id="ev-img-file" accept="image/*" style="display:none;">
            </div>
          </div>
          <div class="admin-modal-footer">
            <button class="btn btn-ghost" onclick="document.getElementById('modal-add-evento').classList.add('hidden')">Cancelar</button>
            <button class="btn btn-primary" id="btn-guardar-evento">Publicar evento</button>
          </div>
        </div>
      </div>`);

    fab.addEventListener('click', () => {
      document.getElementById('ev-fecha').value = new Date().toISOString().split('T')[0];
      document.getElementById('modal-add-evento').classList.remove('hidden');
    });

    initImagePicker('ev-img-file', 'ev-img-preview', 'ev-img-ph');

    document.getElementById('btn-guardar-evento').addEventListener('click', async () => {
      const titulo = document.getElementById('ev-titulo').value.trim();
      const fecha  = document.getElementById('ev-fecha').value;
      if (!titulo || !fecha) { showToast('Rellena título y fecha', 'warning'); return; }

      const btn = document.getElementById('btn-guardar-evento');
      btn.textContent = 'Publicando...'; btn.disabled = true;

      // Subir imagen si hay una
      const imgFile = document.getElementById('ev-img-file').files[0];
      const imagen_url = imgFile ? await uploadMedia(imgFile, 'eventos') : null;

      // Payload exacto para Supabase (solo columnas que existen en la tabla)
      const evParaDB = {
        titulo,
        descripcion: document.getElementById('ev-desc').value.trim(),
        fecha,
        hora: document.getElementById('ev-hora').value,
        lugar: document.getElementById('ev-lugar').value.trim(),
        aforo: document.getElementById('ev-aforo').value.trim() ? parseInt(document.getElementById('ev-aforo').value) : null,
        categoria: document.getElementById('ev-categoria').value,
        created_by: user.name,
        emoji: document.getElementById('ev-emoji').value.trim() || '📅',
        imagen_url
      };

      const sb = getSupabase();
      let savedId = null;
      if (sb) {
        const { data, error } = await sb.from('eventos').insert(evParaDB).select().single();
        if (error) { showToast('Error al guardar: ' + error.message, 'error'); btn.textContent = 'Publicar evento'; btn.disabled = false; return; }
        savedId = data.id;
      } else {
        savedId = 'ev' + Date.now();
      }

      // Objeto local (incluye campos extra para el renderizado)
      const newEv = { ...evParaDB, id: savedId, inscritos: 0 };

      MOCK_EVENTOS.unshift(newEv);
      renderLista();
      document.getElementById('modal-add-evento').classList.add('hidden');
      btn.textContent = 'Publicar evento'; btn.disabled = false;
      showToast('Evento publicado para toda la comunidad ✓', 'success');
    });
  })();
</script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(()=>{});
    }
  </script>
<div id="pt-ready" hidden></div>
<script src="js/abrir-app.js" defer></script>
</body>
</html>
